[project]
name = "api-yamdb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django==5.1.1",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.4.0",
    "django-stubs-ext",
    "djoser==2.3.1",
    "coreapi==2.3.3",
    "pillow==11.0.0",
    "requests==2.32.3",
    "social-auth-app-django==5.4.2",
    "setuptools<81",
    "django-filter>=25.1",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.1",
    "djangorestframework-stubs>=3.18.1",
    "flake8==7.1.1",
    "mypy>=2.3.1",
    "pytest==8.3.3",
    "pytest-django==4.9.0",
    "pytest-pythonpath==0.7.3",
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py311"
line-length = 79
src = ["api_yamdb"]
extend-exclude = ["tests", "**/migrations"]

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "D105", # docstrings are not required for magic methods
    "D107", # docstrings are not required for __init__
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/settings.py" = ["E501"] # long Django setting names

[tool.mypy]
python_version = "3.12"
strict = true
# Модули лежат в api_yamdb/ (api, api_yamdb, reviews, users),
# поэтому путь поиска совпадает с pythonpath из pytest.ini
mypy_path = ["api_yamdb"]
files = ["api_yamdb"]
# Корни пакетов определяются по mypy_path (как в рантайме)
explicit_package_bases = true
exclude = ["migrations"]
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]

[tool.django-stubs]
django_settings_module = "api_yamdb.settings"



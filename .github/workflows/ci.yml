# CI-диспетчер: отдельный вызов переиспользуемого workflow
# (.github/workflows/dev-ci.yml) на каждого разработчика. Внутри вызова
# каждая проверка (ruff, flake8, mypy, pytest) — отдельная атомарная джоба.
#
# Запуск: пуш в ветку разработчика, PR в main, пуш в main.
name: CI

on:
  push:
    branches:
      - main
      - 'dev/**'
      - '**-dev'
      - '**_dev_**'
  pull_request:
    branches:
      - main

jobs:
  # Job разработчика выполняется, если его имя входит в имя ветки
  # (например, для pavel: pavel-dev, dev/pavel/auth, pavel_dev_branch).
  # На push в main и в pull request выполняются все джобы.
  #
  # Чтобы добавить нового разработчика, скопируйте job ниже, подставьте
  # его имя в if и name и перечислите его тесты в with.test-paths.
  pavel:
    name: CI — pavel
    if: >-
      github.ref_name == 'main' ||
      contains(github.ref_name, 'pavel') ||
      (github.event_name == 'pull_request' && contains(github.head_ref, 'pavel'))
    uses: ./.github/workflows/dev-ci.yml
    with:
      developer: pavel
      # Пользователи, регистрация, токены и структурные проверки проекта.
      test-paths: >-
        tests/test_00_user_registration.py
        tests/test_01_users.py
        tests/test_07_files.py

  karina:
    name: CI — karina
    if: >-
      github.ref_name == 'main' ||
      contains(github.ref_name, 'karina') ||
      (github.event_name == 'pull_request' && contains(github.head_ref, 'karina'))
    uses: ./.github/workflows/dev-ci.yml
    with:
      developer: karina
      # Категории, жанры, произведения.
      test-paths: >-
        tests/test_02_category.py
        tests/test_03_genre.py
        tests/test_04_title.py

  elena:
    name: CI — elena
    if: >-
      github.ref_name == 'main' ||
      contains(github.ref_name, 'elena') ||
      (github.event_name == 'pull_request' && contains(github.head_ref, 'elena'))
    uses: ./.github/workflows/dev-ci.yml
    with:
      developer: elena
      # Отзывы и комментарии.
      test-paths: >-
        tests/test_05_review.py
        tests/test_06_comment.py

name: CI

on:
  push:
    branches:
      - main
      - develop
      - karina
      - elena
      - 'dev/**'
      - '**-dev'
      - '**_dev_**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  pavel:
    name: CI — pavel
    if: >-
      github.ref_name == 'main' ||
      github.ref_name == 'develop' ||
      contains(github.ref_name, 'pavel') ||
      (github.event_name == 'pull_request' && contains(github.head_ref, 'pavel'))
    uses: ./.github/workflows/dev-ci.yml
    with:
      developer: pavel
      test-paths: >-
        tests/test_00_user_registration.py
        tests/test_01_users.py
        tests/test_07_files.py
        tests/test_08_import_csv.py

  karina:
    name: CI — karina
    if: >-
      github.ref_name == 'main' ||
      github.ref_name == 'develop' ||
      contains(github.ref_name, 'karina') ||
      (github.event_name == 'pull_request' && contains(github.head_ref, 'karina'))
    uses: ./.github/workflows/dev-ci.yml
    with:
      developer: karina
      test-paths: >-
        tests/test_02_category.py
        tests/test_03_genre.py
        tests/test_04_title.py

  elena:
    name: CI — elena
    if: >-
      github.ref_name == 'main' ||
      github.ref_name == 'develop' ||
      contains(github.ref_name, 'elena') ||
      (github.event_name == 'pull_request' && contains(github.head_ref, 'elena'))
    uses: ./.github/workflows/dev-ci.yml
    with:
      developer: elena
      test-paths: >-
        tests/test_05_review.py
        tests/test_06_comment.py

  # Сквозные тесты без доменной принадлежности: сервисный слой
  # (users/reviews) и инфраструктура (настройки, JWT-контракт).
  # Без if: выполняются на любое событие из блока on (main/develop,
  # PR) — тесты быстрые и покрывают проект целиком.
  infra:
    name: CI — infra
    uses: ./.github/workflows/dev-ci.yml
    with:
      developer: infra
      test-paths: >-
        tests/test_09_services.py
        tests/test_10_settings_jwt.py

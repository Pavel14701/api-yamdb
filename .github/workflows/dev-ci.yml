name: Developer CI

on:
  workflow_call:
    inputs:
      developer:
        description: 'Имя разработчика (для подписи джобы)'
        required: true
        type: string

jobs:
  ci:
    name: CI — ${{ inputs.developer }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy django-stubs djangorestframework-stubs django-stubs-ext

      - name: Ruff (lint)
        run: ruff check .

      - name: Flake8 (lint)
        run: flake8

      - name: Mypy (types)
        run: mypy

      - name: Pytest
        run: pytest
